name: clarke-s-express-shoe-repair-abdul-dev
services:
  web:
    image: ${APP_IMAGE:?Set the approved immutable application image}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      APP_ENVIRONMENT: abdul-dev
    env_file: [/opt/clarke-s-express-shoe-repair-abdul-dev/runtime.env]
    volumes: [/opt/clarke-s-express-shoe-repair-abdul-dev/data:/data]
    mem_limit: 256m
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    networks:
      proxy:
        aliases: [clarke-s-express-shoe-repair-abdul-dev-app]
    logging:
      options:
        max-size: "5m"
        max-file: "2"
networks:
  proxy:
    external: true
    name: xsolutions-proxy
