name: Application CI
on:
  push:
    branches: [main, derek-dev, abdul-dev]
  pull_request:
    branches: [main, derek-dev, abdul-dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Check application container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_graft.py
      - run: python3 scripts/app.py check
