worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/site;
        index index.html;
        # Repeat robots in locations with add_header: nginx replaces inherited headers.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;

        location = /version.json {
            try_files $uri =404;
            default_type application/json;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = /health {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 200 "ok\n";
        }
        location ~ (^|/)\. {
            return 404;
        }
        # Vite fingerprints these assets. Missing files retain a real 404 status.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = / {
            try_files /index.html =404;
        }
        location ~ \.html$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        # Use an authored 404 page when available, otherwise the site's index,
        # while preserving HTTP 404. Never expose nginx's stock error pages.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            try_files /404.html /index.html =404;
        }
    }
}
